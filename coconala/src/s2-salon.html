<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:linear-gradient(160deg,#fbe9ec 0%,#efe4f6 55%,#e3eef8 100%);font-family:'Noto Sans JP';color:#3b3550;position:relative;overflow:hidden}
.frame{position:absolute;inset:50px;border:3px solid #fff;border-radius:30px}

.off{position:absolute;top:370px;width:100%;text-align:center;font-family:'Dela Gothic One';font-size:250px;line-height:1;color:#c0577a;letter-spacing:-.02em}
.off small{font-size:100px}
.menu{position:absolute;top:670px;width:100%;text-align:center;font-size:58px;font-weight:900}
.note{position:absolute;top:765px;width:100%;text-align:center;font-size:30px;color:#6f6787}
.bottom{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:#3b3550;color:#fff;font-size:38px;font-weight:500;padding:20px 50px;border-radius:60px;white-space:nowrap}
.sp{position:absolute;color:#fff;font-size:60px}
