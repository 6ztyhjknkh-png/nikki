<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#f6ecdf;font-family:'Zen Maru Gothic';color:#4a2f22;position:relative;overflow:hidden}
.circle{position:absolute;border-radius:50%}
.c1{width:760px;height:760px;background:#e9d3b8;right:-180px;top:180px}
.c2{width:300px;height:300px;background:#d9b48f;left:-90px;bottom:-100px;opacity:.6}
.top{position:absolute;top:70px;left:80px;font-size:34px;letter-spacing:.3em;font-weight:700;color:#8a5a3c}
.badge{position:absolute;top:150px;left:80px;background:#b5562f;color:#fff;font-size:30px;padding:10px 26px;border-radius:40px;font-weight:700}
h1{position:absolute;top:240px;left:80px;font-size:120px;line-height:1.15;font-weight:900}
h1 small{display:block;font-size:46px;color:#b5562f;margin-bottom:10px}
.cup{position:absolute;right:120px;bottom:210px}
.price{position:absolute;left:80px;bottom:230px;font-size:40px;font-weight:700}
.price b{font-size:96px;color:#b5562f}
.date{position:absolute;left:0;right:0;bottom:0;height:150px;background:#4a2f22;color:#f6ecdf;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;letter-spacing:.06em}
.leaf{position:absolute;font-size:0}
</style></head><body>
<div class="circle c1"></div><div class="circle c2"></div>
<div class="top">KOMOREBI COFFEE</div>
<div class="badge">秋の新メニュー</div>
<h1><small>ほっこり、とろける。</small>栗の<br>モンブラン<br>ラテ</h1>
<svg class="cup" width="380" height="420" viewBox="0 0 380 420">
 <path d="M150 40 q20 -30 0 -60 M200 40 q20 -30 0 -60" stroke="#b08a6b" stroke-width="10" fill="none" stroke-linecap="round" transform="translate(0,40)"/>
 <ellipse cx="170" cy="120" rx="130" ry="40" fill="#f3e2c9"/>
 <path d="M70 130 q30 -70 100 -70 q70 0 100 70z" fill="#c99a6b"/>
 <path d="M95 125 q20 -45 75 -45 q55 0 75 45" stroke="#a87449" stroke-width="8" fill="none"/>
 <path d="M115 125 q15 -28 55 -28 q40 0 55 28" stroke="#a87449" stroke-width="8" fill="none"/>
 <circle cx="170" cy="60" r="16" fill="#7a3f22"/>
 <path d="M40 130 h260 l-30 250 q-5 30 -35 30 h-130 q-30 0 -35 -30z" fill="#fffaf2" stroke="#4a2f22" stroke-width="8"/>
 <path d="M300 180 q70 0 70 60 q0 60 -80 60" stroke="#4a2f22" stroke-width="16" fill="none"/>
 <rect x="70" y="230" width="200" height="60" rx="30" fill="#b5562f"/>
 <text x="170" y="272" text-anchor="middle" font-size="34" fill="#fff" font-family="Zen Maru Gothic" font-weight="900">MARRON</text>
</svg>
<div class="price">Mサイズ <b>¥620</b></div>
<div class="date">11.20 (金) から 期間限定でスタート</div>
</body></html>
