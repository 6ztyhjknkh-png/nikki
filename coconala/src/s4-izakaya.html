<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#16233b;font-family:'Noto Sans JP';color:#fff;position:relative;overflow:hidden}

.price b{font-family:"Dela Gothic One";font-size:110px;color:#e6c068;font-weight:400}

</style></head><body><div class="bg"></div>
<div class="shop">炉端 たぬき</div>

</body></html>
