<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{margin:0;box-sizing:border-box}
body{width:1220px;height:1240px;background:#fff8ee;font-family:'M PLUS Rounded 1c';color:#3a2a20;position:relative;overflow:hidden}
.band{position:absolute;top:0;left:0;right:0;height:120px;background:#ff7a45}
.band2{position:absolute;bottom:0;left:0;right:0;height:120px;background:#ff7a45}
.tag{position:absolute;top:150px;left:70px;background:#3a2a20;color:#fff;font-size:40px;font-weight:800;padding:10px 28px;border-radius:12px}
h1{position:absolute;top:230px;left:70px;font-family:'Dela Gothic One';font-weight:400;font-size:84px;line-height:1.25}
h1 em{font-style:normal;color:#ff5a1f}
.sub{position:absolute;top:470px;left:70px;font-size:44px;font-weight:800}
.sub b{background:linear-gradient(transparent 60%,#ffd84d 60%)}
.grid{position:absolute;top:580px;left:70px;display:grid;grid-template-columns:repeat(4,250px);gap:20px}
.grid img{width:250px;height:250px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.price{position:absolute;top:200px;right:70px;width:270px;height:270px;border-radius:50%;background:#ff5a1f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);box-shadow:0 8px 0 #d64512}
.price span{font-size:40px;font-weight:800}
.price b{font-family:"Dela Gothic One";font-weight:400;font-size:96px;line-height:1}
.points{position:absolute;top:880px;left:70px;display:flex;gap:16px}
.points div{background:#fff;border:3px solid #3a2a20;border-radius:40px;font-size:32px;font-weight:800;padding:10px 24px}
.extra{position:absolute;top:990px;left:70px;font-size:40px;font-weight:800;color:#ff5a1f}</style></head><body>
<div class="band"></div>
<div class="tag">飲食店・美容室・小さなお店の方へ</div>
<h1>SNSの<em>告知画像</em>、<br>作ります。</h1>
<div class="sub"><b>キャッチコピーもまとめて</b>おまかせください</div>
<div class="price"><span>1枚</span><b>500</b><span>円〜</span></div>
<div class="grid"><img src="../images/s1-cafe.png"><img src="../images/s2-salon.png"><img src="../images/s3-bakery.png"><img src="../images/s4-izakaya.png"></div>
<div class="points"><div>新メニュー</div><div>セール</div><div>イベント</div><div>キャンペーン</div></div>
<div class="extra">最短2日でお届け ／ 修正2回まで無料</div><div class="band2"></div>
</body></html>
